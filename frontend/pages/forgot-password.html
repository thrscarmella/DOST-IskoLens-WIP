<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · DOST-IskoLens</title>
<script src="../js/ui-scale.js"></script>
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/theme-dark.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-header">
    <img src="../assets/images/dost-logo.png" alt="DOST logo">
    <div class="auth-header-text">
      <div class="rep-line">Republic of the Philippines</div>
      <div class="inst-line">Science Education Institute</div>
      <div class="brand-line">DOST - IskoLens</div>
    </div>
  </div>

  <div class="auth-body">
    <div class="auth-card">
      <h1 id="reset-title">Reset Password</h1>
      <p class="auth-sub" id="reset-sub">Enter your email address and we will send you a password reset link.</p>

      <form id="reset-form" onsubmit="return handleReset(event)" novalidate>
        <div class="auth-field" id="field-reset-email">
          <label>Enter email address<span class="required">*</span></label>
          <input type="email" placeholder="Enter your email" id="reset-email" required>
          <div class="auth-field-error">Please enter a valid email address.</div>
        </div>

        <button type="submit" class="auth-btn-primary" id="reset-btn">Send Reset Link</button>
      </form>

      <div class="auth-footnote">
        Already remember your password? <a class="auth-link" href="login.html">Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
async function handleReset(e) {
  e.preventDefault();
  const email = document.getElementById('reset-email');
  const wrap = document.getElementById('field-reset-email');
  wrap.classList.remove('has-error');
  if (!email.value.trim() || !email.value.includes('@')) { wrap.classList.add('has-error'); return false; }
  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await IskoAPI.post('/api/auth/forgot-password', { email: email.value.trim() });
    document.getElementById('reset-form').innerHTML = `
      <div class="callout green" style="margin-bottom:20px; background:#0f2b1c; border-left-color:#22c55e; color:#c9f2d8;">
        <i class="fa-solid fa-circle-check" style="color:#22c55e; margin-top:2px;"></i>
        <div><strong style="color:#fff; display:block; margin-bottom:4px;">Check your inbox</strong>
        ${esc(res.message)} The link expires in 30 minutes.</div>
      </div>`;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Send Reset Link';
    showToast('Could not send the link', err.message, 'error');
  }
  return false;
}
</script>
</body>
</html>
