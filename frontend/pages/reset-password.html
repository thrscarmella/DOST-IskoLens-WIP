<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password · DOST-IskoLens</title>
<script src="../js/ui-scale.js"></script>
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/theme-dark.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-header">
    <img src="../assets/images/dost-logo.png" alt="DOST logo">
    <div class="auth-header-text">
      <div class="rep-line">Republic of the Philippines</div>
      <div class="inst-line">Science Education Institute</div>
      <div class="brand-line">DOST - IskoLens</div>
    </div>
  </div>

  <div class="auth-body">
    <div class="auth-card">
      <h1 id="reset-title">Set a new password</h1>
      <p class="auth-sub" id="reset-sub">Checking your link…</p>

      <form id="newpw-form" onsubmit="return handleNewPassword(event)" novalidate style="display:none;">
        <div class="auth-field" id="field-pw">
          <label>New password<span class="required">*</span></label>
          <input type="password" id="new-password" autocomplete="new-password" placeholder="8+ characters: upper, lower, number, symbol" required>
          <div class="auth-field-error">Use at least 8 characters with an uppercase letter, a lowercase letter, a number and a symbol.</div>
        </div>
        <div class="auth-field" id="field-pw2">
          <label>Confirm new password<span class="required">*</span></label>
          <input type="password" id="confirm-password" autocomplete="new-password" placeholder="Re-enter the password" required>
          <div class="auth-field-error">Passwords do not match.</div>
        </div>
        <button type="submit" class="auth-btn-primary" id="newpw-btn">Save password</button>
      </form>

      <div class="auth-footnote">
        Already remember your password? <a class="auth-link" href="login.html">Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/api.js"></script>
<script>
const resetToken = new URLSearchParams(location.search).get('token') || '';

(async function validateLink() {
  try {
    const info = await IskoAPI.get('/api/auth/reset-password/validate?token=' + encodeURIComponent(resetToken));
    document.getElementById('reset-sub').textContent = info.purpose === 'invite'
      ? `Welcome, ${info.name}. Choose a password for ${info.email} to activate your account.`
      : `Choose a new password for ${info.email}.`;
    document.getElementById('newpw-form').style.display = 'block';
  } catch (err) {
    document.getElementById('reset-sub').innerHTML = `${esc(err.message)} <a class="auth-link" href="forgot-password.html">Request a new link</a>.`;
  }
})();

async function handleNewPassword(e) {
  e.preventDefault();
  const pw = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;
  document.getElementById('field-pw').classList.remove('has-error');
  document.getElementById('field-pw2').classList.remove('has-error');
  if (pw.length < 8 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/\d/.test(pw) || !/[^A-Za-z0-9\s]/.test(pw)) { document.getElementById('field-pw').classList.add('has-error'); return false; }
  if (pw !== pw2) { document.getElementById('field-pw2').classList.add('has-error'); return false; }
  const btn = document.getElementById('newpw-btn');
  btn.disabled = true;
  try {
    const res = await IskoAPI.post('/api/auth/reset-password', { token: resetToken, password: pw, confirm_password: pw2 });
    document.getElementById('newpw-form').innerHTML = `
      <div class="callout green" style="margin-bottom:20px; background:#0f2b1c; border-left-color:#22c55e; color:#c9f2d8;">
        <i class="fa-solid fa-circle-check" style="color:#22c55e; margin-top:2px;"></i>
        <div><strong style="color:#fff; display:block; margin-bottom:4px;">Password saved</strong>
        ${res.locked ? 'Your account is still locked from earlier failed sign-ins. Ask an Administrator to unlock it, then sign in.' : 'You can now sign in with your new password.'}</div>
      </div>
      <a class="auth-btn-primary" style="display:block; text-align:center; text-decoration:none;" href="login.html">Go to Login</a>`;
  } catch (err) {
    btn.disabled = false;
    const m = err.fieldErrors.password || err.fieldErrors.confirm_password;
    showToast('Password not saved', m || err.message, 'error');
  }
  return false;
}
</script>
</body>
</html>
